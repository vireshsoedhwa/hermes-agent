services:
  hermes:
    build:
      context: ./hermes
      pull: true
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    stop_grace_period: 15s
    command: gateway run
    shm_size: "4gb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8642:8642"   # gateway API
      - "9119:9119"   # dashboard
    volumes:
      - ./hermes-data:/opt/data
    environment:
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${HERMES_API_SERVER_KEY:-local-dev-key}

      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_TUI=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119

      - HERMES_INFERENCE_PROVIDER=ollama-cloud
      - HERMES_DEFAULT_MODEL=ollama-cloud/gemma4:31b-cloud
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}

      - GATEWAY_ALLOW_ALL_USERS=true

      # Browser automation
      - PLAYWRIGHT_BROWSERS_PATH=/opt/hermes/.playwright
      - AGENT_BROWSER_EXECUTABLE_PATH=/opt/hermes/.playwright/chromium_headless_shell-1223/chrome-linux/headless_shell

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8642/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"

