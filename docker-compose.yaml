services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 15s
    command: gateway run
    shm_size: "4gb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8642:8642"   # gateway API
      - "9119:9119"   # dashboard
    volumes:
      - ./hermes-data:/opt/data
      - ./notebooks:/workspace/notebooks
    environment:
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${HERMES_API_SERVER_KEY:-local-dev-key}

      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_TUI=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_INSECURE=1

      - HERMES_INFERENCE_PROVIDER=ollama-cloud
      - HERMES_DEFAULT_MODEL=ollama-cloud/kimi-k2.6
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}

      - GATEWAY_ALLOW_ALL_USERS=true

      # Shared notebook path visible to both Hermes and Jupyter
      - NOTEBOOK_DIR=/workspace/notebooks
      - JUPYTER_URL=http://jupyter:8888
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-local-dev-token}

      # Browser automation
      - PLAYWRIGHT_BROWSERS_PATH=/opt/hermes/.playwright
      - AGENT_BROWSER_EXECUTABLE_PATH=/opt/hermes/.playwright/chromium_headless_shell-1223/chrome-linux/headless_shell

    depends_on:
      jupyter:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8642/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - ./open-webui:/app/backend/data
    environment:
      - WEBUI_AUTH=false
      - OPENAI_API_BASE_URL=http://hermes:8642/v1
      - OPENAI_API_KEY=${HERMES_API_SERVER_KEY:-local-dev-key}
    depends_on:
      hermes:
        condition: service_healthy

  jupyter:
    build: ./jupyter
    image: hermes-jupyter:latest
    container_name: jupyter
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/workspace/notebooks
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-local-dev-token}
    command: start-notebook.py --ServerApp.root_dir=/workspace/notebooks
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:8888/api/status?token=' + os.getenv('JUPYTER_TOKEN', 'local-dev-token'), timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s