services:
  # Validates that all prerequisites are met before Hermes is allowed to start.
  # Exits non-zero on a missing requirement, which blocks the `hermes` service.
  preflight:
    image: alpine:3.22
    container_name: hermes-preflight
    entrypoint: ["/bin/sh", "/scripts/preflight.sh"]
    restart: "no"
    # No network is needed to validate local credentials and data writability.
    network_mode: none
    volumes:
      - ./scripts:/scripts:ro
      - ${HERMES_DATA_DIR:-./hermes-data}:/data
    environment:
      # Mirrors the hermes service so both see an identical configuration.
      - API_SERVER_HOST=${HERMES_API_SERVER_HOST:-127.0.0.1}
      - API_SERVER_KEY=${HERMES_API_SERVER_KEY:-}
      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS:-true}
      - HERMES_INFERENCE_PROVIDER=${HERMES_INFERENCE_PROVIDER:-ollama-cloud}
      - HERMES_DEFAULT_MODEL=${HERMES_DEFAULT_MODEL:-gpt-oss:120b}
      # LLM providers — at least one must be set.
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      # Optional capabilities — warnings only.
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}

  hermes:
    # Pinned to a multi-arch index digest for supply-chain reproducibility — a
    # floating :latest tag can drift mid-task or pull a compromised publish.
    # To upgrade, look up the new digest and update HERMES_IMAGE in .env:
    #     docker buildx imagetools inspect nousresearch/hermes-agent:latest
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent@sha256:f953da60c908c9e5c35cdbaa355a5851965806d68bd62c616aa03565dd6d2331}
    pull_policy: missing
    container_name: hermes
    restart: unless-stopped
    stop_grace_period: 15s
    command: gateway run
    depends_on:
      preflight:
        condition: service_completed_successfully
    shm_size: "4gb"
    # NOTE: host.docker.internal is deliberately NOT granted to Hermes. It
    # would expose every 127.0.0.1 service on your host (databases, local
    # LLMs, admin panels, cloud credential helpers) to the container. If you
    # genuinely need Hermes to reach a specific host service (e.g. a
    # local Ollama), add a scoped TCP proxy container like blender-bridge
    # below rather than re-adding a broad host-gateway route here.
    ports:
      # Loopback-only by default; set HERMES_API_SERVER_HOST=0.0.0.0 to expose.
      - "127.0.0.1:8642:8642"   # OpenAI-compatible API (loopback by default)
      - "127.0.0.1:9119:9119"   # dashboard
    volumes:
      - ${HERMES_DATA_DIR:-./hermes-data}:/opt/data
      # General host <-> Hermes file exchange; project source is never mounted.
      - ${HERMES_SHARED_DIR:-./shared}:/shared
    environment:
      # The API server always runs (the dashboard needs it for cron fires).
      # It binds to 127.0.0.1 by default — internal only. Set
      # HERMES_API_SERVER_HOST=0.0.0.0 in .env to expose port 8642 externally.
      - API_SERVER_HOST=${HERMES_API_SERVER_HOST:-127.0.0.1}
      - API_SERVER_KEY=${HERMES_API_SERVER_KEY:-}

      - HERMES_DASHBOARD=1

      # Dashboard basic-auth. Only engaged on a non-loopback bind
      # (HERMES_API_SERVER_HOST=0.0.0.0). Env wins over the password_hash
      # in hermes-data/config.yaml, so rotate the password via .env.
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH:-}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}

      - HERMES_INFERENCE_PROVIDER=${HERMES_INFERENCE_PROVIDER:-ollama-cloud}
      - HERMES_DEFAULT_MODEL=${HERMES_DEFAULT_MODEL:-gpt-oss:120b}

      # LLM providers — at least one must be set (enforced by preflight).
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}

      # Optional capabilities.
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}

      - GATEWAY_ALLOW_ALL_USERS=${GATEWAY_ALLOW_ALL_USERS:-true}

      # Permit Hermes to write its persistent data and explicit host exchange
      # directories. /shared is the host exchange dir.
      - HERMES_WRITE_SAFE_ROOT=/opt/data:/shared

      # On Linux, set these in .env to match your host user so files written
      # into the shared data folder stay editable: HERMES_UID=$(id -u)
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}

    # Asks the s6 supervisor directly whether the gateway is up.
    # Note: s6-svstat exits 0 even when a service is down, so the 'up'
    # match is what actually gates it. /command is not on the exec PATH,
    # hence the absolute path.
    healthcheck:
      test: ["CMD-SHELL", "/command/s6-svstat /run/service/gateway-default | grep -q '^up'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"
          # Caps runaway process spawning. Declared here rather than as a
          # top-level pids_limit: Compose rejects both at once.
          pids: 512

    security_opt:
      - no-new-privileges:true

    # Dropping all capabilities is the stricter posture. The official image is
    # s6-supervised and starts as root before dropping to HERMES_UID, so it
    # needs a few capabilities back. If the container fails to come up after a
    # Hermes image upgrade, comment this block out, smoke test, and report it.
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE", "FOWNER", "FSETID"]

    networks:
      - hermes_egress

  # ---------------------------------------------------------------------------
  # blender-bridge — scoped bridge to a single host-side MCP server.
  #
  # The Blender editor and its MCP server run on the host (they talk to the
  # GUI editor over localhost sockets). This tiny socat container is the ONLY
  # thing granted a route to host.docker.internal — Hermes stays un-granted
  # and can reach the host service only through this bridge, on this one port.
  #
  # It lives on hermes_egress alongside Hermes, so Hermes reaches it as
  # http://blender-bridge:9876. For a stdio blender-mcp server, wrap it with
  # a stdio→HTTP bridge (e.g. supergateway) bound to 127.0.0.1:9876 on the
  # host. Then set mcp_servers.blender.url in hermes-data/config.yaml to
  # http://blender-bridge:9876.
  # ---------------------------------------------------------------------------
  blender-bridge:
    image: alpine/socat
    container_name: hermes-blender-bridge
    restart: unless-stopped
    # Forward one fixed port on the hermes_egress side to the same port on
    # the host loopback. socat stays in the foreground.
    entrypoint: ["sh", "-c"]
    command: ["socat TCP-LISTEN:9876,fork,reuseaddr TCP:host.docker.internal:9876"]
    # Scoped to THIS container only — Hermes never gets this.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hermes_egress
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.5"
          pids: 32

networks:
  hermes_egress: {}
