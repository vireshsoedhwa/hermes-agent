services:
  # Validates that all prerequisites are met before Hermes is allowed to start.
  # Exits non-zero on a missing requirement, which blocks the `hermes` service.
  preflight:
    image: alpine:3.22
    container_name: hermes-preflight
    entrypoint: ["/bin/sh", "/scripts/preflight.sh"]
    restart: "no"
    volumes:
      - ./scripts:/scripts:ro
      - ${HERMES_DATA_DIR:-./hermes-data}:/data
    environment:
      # Mirrors the hermes service so both see an identical configuration.
      - API_SERVER_HOST=${HERMES_API_SERVER_HOST:-127.0.0.1}
      - API_SERVER_KEY=${HERMES_API_SERVER_KEY:-}
      - GATEWAY_ALLOW_ALL_USERS=true
      - HERMES_INFERENCE_PROVIDER=${HERMES_INFERENCE_PROVIDER:-ollama-cloud}
      - HERMES_DEFAULT_MODEL=${HERMES_DEFAULT_MODEL:-ollama-cloud/gemma4:31b-cloud}
      # LLM providers — at least one must be set.
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}
      # Optional capabilities — warnings only.
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}

  hermes:
    image: nousresearch/hermes-agent:latest
    pull_policy: always
    container_name: hermes
    restart: unless-stopped
    stop_grace_period: 15s
    command: gateway run
    depends_on:
      preflight:
        condition: service_completed_successfully
    shm_size: "4gb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Loopback-only by default; set HERMES_API_SERVER_HOST=0.0.0.0 to expose.
      - "8642:8642"   # OpenAI-compatible API (loopback by default)
      - "9119:9119"   # dashboard
    volumes:
      - ${HERMES_DATA_DIR:-./hermes-data}:/opt/data
    environment:
      # The API server always runs (the dashboard needs it for cron fires).
      # It binds to 127.0.0.1 by default — internal only. Set
      # HERMES_API_SERVER_HOST=0.0.0.0 in .env to expose port 8642 externally.
      - API_SERVER_HOST=${HERMES_API_SERVER_HOST:-127.0.0.1}
      - API_SERVER_KEY=${HERMES_API_SERVER_KEY:-}

      - HERMES_DASHBOARD=1

      - HERMES_INFERENCE_PROVIDER=${HERMES_INFERENCE_PROVIDER:-ollama-cloud}
      - HERMES_DEFAULT_MODEL=${HERMES_DEFAULT_MODEL:-ollama-cloud/gemma4:31b-cloud}

      # LLM providers — at least one must be set (enforced by preflight).
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - XAI_API_KEY=${XAI_API_KEY:-}

      # Optional capabilities.
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}

      - GATEWAY_ALLOW_ALL_USERS=true

      # On Linux, set these in .env to match your host user so files written
      # into the shared data folder stay editable: HERMES_UID=$(id -u)
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}

    # Asks the s6 supervisor directly whether the gateway is up.
    # Note that s6-svstat exits 0 even when a service is down, so the 'up'
    # match is what actually gates it. /command is not on the exec PATH,
    # hence the absolute path.
    healthcheck:
      test: ["CMD-SHELL", "/command/s6-svstat /run/service/gateway-default | grep -q '^up'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"

